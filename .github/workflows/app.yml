name: App checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'data/timetable.json'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.editorconfig'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ktlint, Android lint, release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew --console=plain ktlintCheck

      # Runs even if an earlier check failed.
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew --console=plain :app:lintRelease

      - name: Release build
        id: build
        if: ${{ !cancelled() }}
        run: ./gradlew --console=plain :app:assembleRelease

      # Debug-signed: sideload only.
      - name: Upload APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: train-lanka-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
