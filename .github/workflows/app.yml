name: App checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'data/timetable.json'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.editorconfig'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew --console=plain ktlintCheck :app:lintRelease :app:assembleRelease

      # Debug-signed: sideload only.
      - uses: actions/upload-artifact@v7
        with:
          name: train-lanka-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
